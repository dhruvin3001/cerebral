[project]
name = "cerebral"
version = "0.1.0"
description = "Permanent memory MCP server for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mem0ai",
    "mcp[cli]",
    "python-dotenv",
    "qdrant-client",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
